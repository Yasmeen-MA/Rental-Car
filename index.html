<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Rental Car</title>
  </head>
  <body>
    <main>
       <div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card p-4 rounded-4" style="max-width: 500px; width: 100%;">
    <h3 class="fw-bold mb-4">Search for a rental car</h3>

    <form>
      <div class="mb-3">
        <label class="form-label small">Pick up location</label>
        <input type="text" class="form-control" placeholder="City, airport, region, district...">
      </div>

      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="deliver">
        <label class="form-check-label small" for="deliver">
          Deliver the car somewhere else
        </label>
      </div>

      <div class="row g-2 mb-3">
        <div class="col-6">
          <label class="form-label small">Date of pickup</label>
          <input type="date" class="form-control form-control-sm" value="2022-03-26">
        </div>
        <div class="col-6">
          <label class="form-label small">Date of delivery</label>
          <input type="date" class="form-control form-control-sm" value="2022-03-29">
        </div>
      </div>

      <div class="row g-2 mb-3">
        <div class="col-3">
          <select class="form-select form-select-sm"><option>10</option></select>
        </div>
        <div class="col-3">
          <select class="form-select form-select-sm"><option>00</option></select>
        </div>
        <div class="col-3">
          <select class="form-select form-select-sm"><option>10</option></select>
        </div>
        <div class="col-3">
          <select class="form-select form-select-sm"><option>00</option></select>
        </div>
      </div>

      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="ageCheck" checked>
        <label class="form-check-label small" for="ageCheck">
          The driver's age between 30 and 65?
        </label>
      </div>

      <ul class="list-unstyled small mb-4">
        <li>✓ No credit card fees</li>
        <li>✓ No change fees</li>
        <li>✓ Price match guarantee</li>
      </ul>

      <button type="submit" class="btn btn-danger w-100 btn-lg rounded-pill fw-bold">
        Search
      </button>
    </form>

  </div>
</div>
    </main>
    

    <script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js
"></script
  </body>
</html>
